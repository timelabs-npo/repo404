name: gccmp-alpha-nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gccmp-alpha-nightly
  cancel-in-progress: false

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
            goos: windows
            goarch: amd64
            binary: gccmp.exe
          - id: macos-arm64
            os: macos-26
            goos: darwin
            goarch: arm64
            binary: gccmp
          - id: macos-x64
            os: macos-26-intel
            goos: darwin
            goarch: amd64
            binary: gccmp
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gccmp-alpha
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: gccmp-alpha/go.mod
      - name: Test
        shell: bash
        run: go test -count=1 ./...
      - name: Build and execute native alpha
        shell: bash
        run: |
          mkdir -p dist/evidence out
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "dist/${{ matrix.binary }}" ./cmd/gccmp
          "dist/${{ matrix.binary }}" snapshot --label fixture-a --out dist/evidence/snapshot-a.json testdata/fixture-a
          "dist/${{ matrix.binary }}" snapshot --label fixture-b --out dist/evidence/snapshot-b.json testdata/fixture-b
          "dist/${{ matrix.binary }}" compare --out dist/evidence/comparison.json dist/evidence/snapshot-a.json dist/evidence/snapshot-b.json
          cp dist/evidence/*.json out/
          python3 scripts/check_golden.py
      - name: Emit nightly receipt
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          dist = pathlib.Path('dist')
          tracked = sorted(p for p in dist.rglob('*') if p.is_file())
          (dist/'SHA256SUMS').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(dist).as_posix()}\n" for p in tracked), encoding='utf-8')
          receipt = {
            'schema':'gccmp.nightly-receipt/v0.1','canonical':False,
            'target_id':os.environ['TARGET_ID'],'binary':os.environ['BINARY_NAME'],
            'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH'],
            'go_version':subprocess.check_output(['go','version'], text=True).strip(),
            'result':'pass'
          }
          (dist/'NIGHTLY-RECEIPT.json').write_text(json.dumps(receipt, sort_keys=True, separators=(',', ':'))+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gccmp-nightly-${{ matrix.id }}-${{ github.run_number }}
          path: gccmp-alpha/dist/
          retention-days: 14
          if-no-files-found: error

  converge:
    name: nightly-cross-os-convergence
    needs: nightly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: gccmp-nightly-*
          path: artifacts
      - name: Verify all nightly canonical receipts converge
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('artifacts')
          names = ('snapshot-a.json','snapshot-b.json','comparison.json')
          result = {'schema':'gccmp.nightly-convergence/v0.1','canonical':False,'result':'pass','receipts':{}}
          for name in names:
              found = sorted(root.glob(f'*/evidence/{name}'))
              if len(found) != 3:
                  raise SystemExit(f'expected 3 {name} files, found {len(found)}')
              blobs = [p.read_bytes() for p in found]
              if any(blob != blobs[0] for blob in blobs[1:]):
                  raise SystemExit(f'nightly cross-OS mismatch: {name}')
              golden = pathlib.Path('gccmp-alpha/testdata/golden') / name
              if blobs[0] != golden.read_bytes():
                  raise SystemExit(f'nightly output differs from golden: {name}')
              digest = hashlib.sha256(blobs[0]).hexdigest()
              result['receipts'][name] = {'sha256':digest,'copies':[str(p) for p in found]}
              print(f'NIGHTLY CONVERGED {name} sha256={digest}')
          out = pathlib.Path('convergence')
          out.mkdir()
          (out/'NIGHTLY-CONVERGENCE.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gccmp-nightly-convergence-${{ github.run_number }}
          path: convergence/
          retention-days: 30
